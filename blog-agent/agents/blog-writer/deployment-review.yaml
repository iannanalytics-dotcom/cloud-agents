# One blog post in review mode: Monday and Wednesday 6:00 am, one post each, for the next free publishing slot.
# Review mode = the row lands at Planned and a person approves it by changing Status to Written (it then arrives in
# WordPress as a draft). Created PAUSED (tools/deploy.py pauses it straight after creating it); test with a manual run
# first. Since its scheduled run on 19 Oct 2026 it stays paused and runs on demand.
name: Blog post (review mode)
agent: ./agent.md
environment_id: ./environment.yaml
vault_ids:
  - YOUR_VAULT_ID   # deploy.py writes in the vault id from claude-lock.json
schedule:
  type: cron
  expression: "0 6 * * 1,3"   # Mon + Wed 6:00 when unpaused
  timezone: Australia/Perth
budget:
  type: limit
  max_list_cost: {amount: "900", currency: USD}   # hard cap of US$9 per run, set from measured runs (US$7.56, then US$5.22)
initial_events:
  - type: user.message
    content:
      - type: text
        text: |
          Scheduled run. Site: YOUR_SITE. Mode: review.
          Follow your run book (the blog-kit skill) from step 0: prepare the run, plan one post for the next free
          slot, research and write it, have the Blog editor check it, make the thumbnail, and deliver it with
          deliver.py in review mode (it lands at Planned for a person to approve). If anything cannot be made right,
          hold it with the reason. Finish with the run report from step 9.
